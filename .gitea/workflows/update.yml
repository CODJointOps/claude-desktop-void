name: Auto Update Claude Desktop Template

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

env:
  # Anthropic Claude Code Release Signing <security@anthropic.com>
  SIGNING_FPR: 31DDDE24DDFAB679F42D7BD2BAA929FF1A7ECACE
  REPO_URL: https://downloads.claude.ai/claude-desktop/apt/stable

jobs:
  update-template:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y curl gnupg

      # Everything downstream is derived from this signature. If it does not
      # verify against the pinned fingerprint, the job fails rather than
      # publishing an unattested checksum.
      - name: Verify Signed Repository Index
        run: |
          set -euo pipefail
          mkdir -p work && cd work

          curl -fsSLo key.asc https://downloads.claude.ai/claude-desktop/key.asc
          export GNUPGHOME="$PWD/gnupg"
          mkdir -m 700 -p "$GNUPGHOME"
          gpg --batch --import key.asc
          gpg --batch --with-colons --fingerprint \
            | awk -F: '/^fpr:/{print $10}' | grep -qx "$SIGNING_FPR"

          curl -fsSLo InRelease "$REPO_URL/dists/stable/InRelease"
          gpg --batch --verify InRelease

          # gpg validates the signature but not the index's own freshness;
          # apt enforces Valid-Until and so must we, or a replayed old index
          # could pin us to a superseded build.
          VALID_UNTIL=$(sed -n 's/^Valid-Until: //p' InRelease)
          if [[ $(date -u -d "$VALID_UNTIL" +%s) -lt $(date -u +%s) ]]; then
            echo "Repository index expired at $VALID_UNTIL"
            exit 1
          fi

      - name: Resolve Latest Version
        id: resolve
        run: |
          set -euo pipefail
          cd work

          for arch in amd64 arm64; do
            path="main/binary-$arch/Packages.gz"
            curl -fsSLo "Packages-$arch.gz" "$REPO_URL/dists/stable/$path"

            # The SHA256 block of InRelease is the signed root of trust for
            # each index file; anything not listed there is not Anthropic's.
            want=$(awk -v p="$path" '
              /^SHA256:/{s=1;next} /^[A-Za-z]/{s=0}
              s && $3==p {print $1}' InRelease)
            got=$(sha256sum "Packages-$arch.gz" | awk '{print $1}')
            if [[ -z "$want" || "$want" != "$got" ]]; then
              echo "Packages index for $arch does not match the signed Release"
              exit 1
            fi
            gunzip -c "Packages-$arch.gz" > "Packages-$arch"
          done

          LATEST=$(awk '/^Version:/{print $2}' Packages-amd64 | sort -V | tail -1)
          if [[ -z "$LATEST" ]]; then
            echo "No versions in index"
            exit 1
          fi

          # Read the checksum out of the signed index rather than downloading
          # 160 MB per arch and hashing it ourselves.
          get_sha() {
            awk -v RS='' -v v="Version: $1" '$0 ~ v' "Packages-$2" \
              | sed -n 's/^SHA256: //p' | head -1
          }
          SHA_AMD64=$(get_sha "$LATEST" amd64)
          SHA_ARM64=$(get_sha "$LATEST" arm64)

          if [[ -z "$SHA_AMD64" || -z "$SHA_ARM64" ]]; then
            echo "Version $LATEST is not published for both architectures yet"
            exit 0
          fi

          echo "version=$LATEST" >> $GITHUB_OUTPUT
          echo "sha_amd64=$SHA_AMD64" >> $GITHUB_OUTPUT
          echo "sha_arm64=$SHA_ARM64" >> $GITHUB_OUTPUT

      - name: Update Template
        if: steps.resolve.outputs.version
        id: update
        run: |
          set -euo pipefail
          NEW="${{ steps.resolve.outputs.version }}"
          CURRENT=$(sed -n 's/^version=//p' template)

          if [[ "$NEW" == "$CURRENT" ]]; then
            echo "Already on $CURRENT"
            exit 0
          fi

          # A new upstream version always resets revision; same-version
          # rebuilds do not exist in this repo any more, since the apt pool
          # publishes one artifact per version.
          sed -i "s/^version=.*/version=${NEW}/" template
          sed -i "s/^revision=.*/revision=1/" template

          # Two checksum= lines, one per branch of the arch case statement;
          # the _deb_arch line above each one says which is which.
          awk -v amd64="${{ steps.resolve.outputs.sha_amd64 }}" \
              -v arm64="${{ steps.resolve.outputs.sha_arm64 }}" '
            /_deb_arch=amd64/ { sha = amd64 }
            /_deb_arch=arm64/ { sha = arm64 }
            /^\tchecksum=/   { $0 = "\tchecksum=" sha }
            { print }
          ' template > template.new && mv template.new template

          echo "changed=1" >> $GITHUB_OUTPUT

      - name: Commit and Push
        if: steps.update.outputs.changed
        run: |
          set -euo pipefail
          git config user.name "Wizzard"
          git config user.email "rich@bandaholics.cash"
          git add template
          if ! git diff --cached --quiet; then
            git commit -m "Update to ${{ steps.resolve.outputs.version }} [auto]"
            git pull --rebase origin master
            git push
          fi
